<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống LMS Đám Mây - Google Sheets DB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .list-group-item.active small { color: rgba(255,255,255,0.8) !important; }
        .style-desc { font-size: 0.85rem; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="container mt-5 mb-5">
        <h2 class="text-center mb-2 text-success fw-bold">HỆ THỐNG LMS TRÊN ĐÁM MÂY GOOGLE</h2>
        <p class="text-center text-muted mb-4">Dữ liệu đồng bộ trực tiếp từ Google Sheets - Vượt mọi tường lửa trường học</p>
        
        <div class="row mt-4">
            <div class="col-md-4">
                <div class="list-group shadow-sm mb-4">
                    <h5 class="p-3 bg-dark text-white border rounded-top m-0">Khóa học hiện có</h5>
                    <div id="course-list">
                        <div class="p-3 text-center text-muted">Đang kết nối đám mây Google...</div>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div id="lesson-container">
                    <div class="alert alert-info text-center p-5 shadow-sm">
                        <h4 class="alert-heading">Chào Thầy và các em học sinh!</h4>
                        <p class="m-0">Vui lòng chọn một khóa học ở danh mục bên trái để hiển thị bài giảng.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Cấu hình ID Google Sheet của anh
        const SHEET_ID = '1Hh-JSTQvt7y-Yr0I1U-6aoRaoJwX4Kb_1kBl-7OdX28';
        
        let allCourses = [];
        let allLessons = [];
        let currentCourseId = null;

        // Hàm chuyển đổi dữ liệu CSV từ Google Sheet sang dạng JSON mượt mà
        function csvToObjects(csvText) {
            const lines = csvText.split('\n').map(line => line.trim()).filter(line => line.length > 0);
            if (lines.length === 0) return [];
            const headers = lines[0].split(',').map(h => h.replace(/^"|"$/g, '').trim());
            
            return lines.slice(1).map(line => {
                // Xử lý cắt chuỗi theo dấu phẩy nhưng giữ nguyên dữ liệu trong dấu ngoặc kép
                const values = line.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || line.split(',');
                const obj = {};
                headers.forEach((header, index) => {
                    let val = values[index] ? values[index].replace(/^"|"$/g, '').trim() : '';
                    obj[header] = val;
                });
                return obj;
            });
        }

        // Tải toàn bộ dữ liệu từ đám mây Google Sheets về
        async function loadDataFromCloud() {
            try {
                // Gọi data từ sheet 'courses'
                const resCourses = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=courses`);
                const textCourses = await resCourses.text();
                allCourses = csvToObjects(textCourses);

                // Gọi data từ sheet 'lessons'
                const resLessons = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=lessons`);
                const textLessons = await resLessons.text();
                allLessons = csvToObjects(textLessons);

                renderCourses();
            } catch (err) {
                document.getElementById('course-list').innerHTML = `<div class="p-3 text-danger">Không thể kết nối đến đám mây Google: ${err.message}</div>`;
            }
        }

        // Render danh mục khóa học
        function renderCourses() {
            const listContainer = document.getElementById('course-list');
            if (allCourses.length === 0) {
                listContainer.innerHTML = '<div class="p-3 text-center text-muted">Chưa có khóa học nào trên Cloud.</div>';
                return;
            }

            let html = '';
            allCourses.forEach(course => {
                const activeClass = currentCourseId == course.id ? 'active' : '';
                html += `
                    <button onclick="selectCourse(${course.id})" class="list-group-item list-group-item-action p-3 ${activeClass}">
                        <h6 class="mb-1 fw-bold">${course.title}</h6>
                        <small class="d-block text-muted style-desc">${course.description || ''}</small>
                    </button>
                `;
            });
            listContainer.innerHTML = html;
        }

        // Xem chi tiết bài học
        function selectCourse(courseId) {
            currentCourseId = courseId;
            renderCourses();

            const container = document.getElementById('lesson-container');
            const filteredLessons = allLessons.filter(l => l.course_id == courseId);

            let html = '<h5 class="mb-3 text-secondary border-bottom pb-2">Nội dung chi tiết bài học</h5>';
            if (filteredLessons.length === 0) {
                html += '<div class="alert alert-warning">Chưa cập nhật bài học cho khóa này.</div>';
            } else {
                filteredLessons.forEach(lesson => {
                    html += `
                        <div class="card mb-3 shadow-sm border-start border-success border-4">
                            <div class="card-body">
                                <h5 class="card-title text-success fw-bold">${lesson.title}</h5>
                                <hr class="my-2 text-muted">
                                <p class="card-text text-dark" style="white-space: pre-line; line-height: 1.6;">${lesson.content}</p>
                            </div>
                        </div>
                    `;
                });
            }
            container.innerHTML = html;
        }

        window.onload = loadDataFromCloud;
    </script>
</body>
</html>
