<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hệ thống LMS Online - Supabase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="app" class="container mt-5">
        <h2 class="text-center mb-4 text-success">HỆ THỐNG LMS ONLINE (SUPABASE)</h2>
        <p class="text-center text-muted">Học sinh có thể truy cập học tập từ xa 24/7</p>
        
        <div class="row mt-4">
            <div class="col-md-4">
                <div class="list-group">
                    <h5 class="p-2 bg-light border rounded m-0">Khóa học của trường</h5>
                    <button 
                        v-for="course in courses" 
                        :key="course.id"
                        @click="selectCourse(course.id)"
                        class="list-group-item list-group-item-action"
                        :class="{ active: selectedCourseId === course.id }"
                    >
                        <strong>{{ course.title }}</strong>
                        <small class="d-block text-muted style-desc">{{ course.description }}</small>
                    </button>
                </div>
            </div>

            <div class="col-md-8">
                <div v-if="selectedCourseId">
                    <h5 class="mb-3 text-secondary">Nội dung chi tiết bài học</h5>
                    <div v-if="lessons.length === 0" class="alert alert-warning">Chưa cập nhật bài học cho khóa này.</div>
                    
                    <div v-for="lesson in lessons" :key="lesson.id" class="card mb-3 shadow-sm">
                        <div class="card-body">
                            <h5 class="card-title text-primary">{{ lesson.title }}</h5>
                            <hr>
                            <p class="card-text text-dark" style="white-space: pre-line;">{{ lesson.content }}</p>
                        </div>
                    </div>
                </div>
                <div v-else class="alert alert-info text-center">
                    Vui lòng chọn một khóa học bên trái để bắt đầu bài học.
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;

        // 1. Cấu hình kết nối Supabase (Anh điền thông tin của anh vào đây nhé)
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabase = Supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        createApp({
            setup() {
                const courses = ref([]);
                const lessons = ref([]);
                const selectedCourseId = ref(null);

                // 2. Lấy danh sách khóa học từ Supabase Cloud
                const fetchCourses = async () => {
                    const { data, error } = await supabase
                        .from('courses')
                        .select('*')
                        .order('id', { ascending: true });
                    
                    if (error) console.error('Lỗi lấy khóa học:', error);
                    else courses.value = data;
                };

                // 3. Lấy danh sách bài học dựa theo ID khóa học được click
                const selectCourse = async (courseId) => {
                    selectedCourseId.value = courseId;
                    const { data, error } = await supabase
                        .from('lessons')
                        .select('*')
                        .eq('course_id', courseId)
                        .order('id', { ascending: true });

                    if (error) console.error('Lỗi lấy bài học:', error);
                    else lessons.value = data;
                };

                onMounted(() => {
                    fetchCourses();
                });

                return {
                    courses,
                    lessons,
                    selectedCourseId,
                    selectCourse
                }
            }
        }).mount('#app');
    </script>

    <style>
        .list-group-item.active small { color: #fff !important; }
        .style-desc { font-size: 0.85rem; margin-top: 4px; }
    </style>
</body>
</html>
