<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống LMS Đám Mây - Trường TCN Củ Chi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .list-group-item.active small { color: rgba(255,255,255,0.8) !important; }
        .style-desc { font-size: 0.85rem; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="container mt-5 mb-5">
        <h2 class="text-center mb-2 text-success fw-bold">HỆ THỐNG LMS TRƯỜNG TRUNG CẤP NGHỀ CỦ CHI</h2>
        <p class="text-center text-muted mb-4">Dữ liệu đồng bộ trực tiếp từ Google Sheets Cloud</p>
        
        <div class="row mt-4">
            <div class="col-md-4">
                <div class="list-group shadow-sm mb-4">
                    <h5 class="p-3 bg-dark text-white border rounded-top m-0">Khóa học hiện có</h5>
                    <div id="course-list">
                        <div class="p-3 text-center text-muted">Đang kết nối đám mây Google...</div>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div id="lesson-container">
                    <div class="alert alert-info text-center p-5 shadow-sm">
                        <h4 class="alert-heading">Chào Thầy và các em học sinh!</h4>
                        <p class="m-0">Vui lòng chọn một khóa học ở danh mục bên trái để hiển thị bài giảng.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 🛠️ ĐIỀN ID FILE GOOGLE SHEET CỦA ANH VÀO ĐÂY
        const SHEET_ID = '1Hh-JSTQvt7y-Yr0I1U-6aoRaoJwX4Kb_1kBl-7OdX28';
        
        let allCourses = [];
        let allLessons = [];
        let currentCourseId = null;

        // Hàm xử lý cắt chuỗi CSV thông minh
        function parseCSV(text) {
            let lines = [];
            let row = [""];
            let inQuotes = false;

            for (let i = 0; i < text.length; i++) {
                let c = text[i];
                let next = text[i+1];
                if (c === '"') {
                    if (inQuotes && next === '"') { row[row.length - 1] += '"'; i++; }
                    else { inQuotes = !inQuotes; }
                } else if (c === ',' && !inQuotes) {
                    row.push('');
                } else if ((c === '\r' || c === '\n') && !inQuotes) {
                    if (c === '\r' && next === '\n') { i++; }
                    lines.push(row);
                    row = [''];
                } else {
                    row[row.length - 1] += c;
                }
            }
            if (row.length > 1 || row[0] !== '') lines.push(row);
            
            const headers = lines[0].map(h => h.trim());
            return lines.slice(1).map(line => {
                const obj = {};
                headers.forEach((header, index) => {
                    obj[header] = line[index] ? line[index].trim() : '';
                });
                return obj;
            });
        }

        // Tải dữ liệu từ Google Sheets Cloud
        async function loadDataFromCloud() {
            try {
                const resCourses = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=courses`);
                allCourses = parseCSV(await resCourses.text());

                const resLessons = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=lessons`);
                allLessons = parseCSV(await resLessons.text());

                renderCourses();
            } catch (err) {
                document.getElementById('course-list').innerHTML = `<div class="p-3 text-danger">Không thể tải dữ liệu: ${err.message}</div>`;
            }
        }

        function renderCourses() {
            const listContainer = document.getElementById('course-list');
            if (allCourses.length === 0) {
                listContainer.innerHTML = '<div class="p-3 text-center text-muted">Chưa có dữ liệu.</div>';
                return;
            }
            let html = '';
            allCourses.forEach(course => {
                const activeClass = currentCourseId == course.id ? 'active' : '';
                html += `<button onclick="selectCourse(${course.id})" class="list-group-item list-group-item-action p-3 ${activeClass}"><h6 class="mb-1 fw-bold">${course.title}</h6><small class="d-block text-muted style-desc">${course.description || ''}</small></button>`;
            });
            listContainer.innerHTML = html;
        }

        function selectCourse(courseId) {
            currentCourseId = courseId;
            renderCourses();

            const container = document.getElementById('lesson-container');
            const filteredLessons = allLessons.filter(l => l.course_id == courseId);

            let html = '<h5 class="mb-3 text-secondary border-bottom pb-2">Nội dung chi tiết bài học</h5>';
            if (filteredLessons.length === 0) {
                html += '<div class="alert alert-warning">Chưa cập nhật bài học cho khóa này.</div>';
            } else {
                filteredLessons.forEach(lesson => {
                    // 🌟 KHẮC PHỤC LỖI HIỂN THỊ CHỮ \n TẠI ĐÂY:
                    let cleanContent = lesson.content
                        .replace(/\\\\n/g, '\n')
                        .replace(/\\n/g, '\n');

                    html += `
                        <div class="card mb-3 shadow-sm border-start border-success border-4">
                            <div class="card-body">
                                <h5 class="card-title text-success fw-bold">${lesson.title}</h5>
                                <hr class="my-2 text-muted">
                                <p class="card-text text-dark" style="white-space: pre-line; line-height: 1.6;">${cleanContent}</p>
                            </div>
                        </div>
                    `;
                });
            }
            container.innerHTML = html;
        }

        window.onload = loadDataFromCloud;
    </script>
</body>
</html>
